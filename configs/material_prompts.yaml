# Material-specific defect analysis prompts
# Each material includes: domain knowledge + CoT reasoning + judgment rules

book:
  name: "书籍"
  analysis_prompt: |
    ## 领域知识
    这是【书籍类】商品，包括平装书、塑封书、精装书等所有类型。常见缺陷模式：
    - 边角折角/翘起：封面四角向内折叠或翘起（透过塑封也可观察到）
    - 封面弯曲/变形：封面整体呈现弯曲、弧形，不是平整状态
    - 封面压痕/划痕：封面表面有凹陷痕迹或细长划痕
    - 书脊破损：书脊处开裂、分层或撕裂
    - 边角磨损：角落处磨损发白，与周围颜色明显不同
    - 封面污渍：封面有油渍、水渍或其他污染
    - 页面褶皱：内页或封面有褶皱痕迹
    - 塑封膜破损：塑封书外层塑料膜撕裂、穿孔或开口
    - 塑封松垮：塑封膜未紧贴书封面，有气泡或褶皱
    - 书壳损坏：精装书的书壳破损、撕裂
    - 装帧问题：书页脱落、装订松动
    - 包装问题：包装不完整

    ## 缺陷检查清单（逐项确认）—— CoT推理

    Step 1 - 书籍类型识别:
    首先判断书籍类型：
    - [ ] 是否为平装书（纸质封面，无塑料膜）
    - [ ] 是否为塑封书（外层有透明塑料膜紧密包裹）
    - [ ] 是否为精装书（硬质书壳，装帧精美）
    - [ ] 是否为其他特殊装帧书籍

    Step 2 - 塑封膜检查（仅针对塑封书）:
    - [ ] 塑封膜是否完整，是否有破损/撕裂/穿孔
    - [ ] 塑封边缘是否完全密封，是否有开口
    - [ ] 塑封膜是否紧贴书封面（标准状态）
    - [ ] 封面与膜之间是否有明显气泡或大面积松垮
    - [ ] 书角处塑封是否紧贴

    Step 3 - 四角平整度检查:
    【常见缺陷！必须放大检查】书籍右下角翘起是最常见的缺陷类型，必须仔细观察！
    观察书籍封面四个角（透过塑封也可观察），分别确认：
    - [ ] 左上角: 是否有折角/翘起（封面材料本身向内折叠或向上翘起）
    - [ ] 右上角: 是否有折角/翘起
    - [ ] 左下角: 是否有折角/翘起
    - [ ] 右下角: 是否有折角/翘起（最常见缺陷位置，必须放大检查！）

    【如何区分正常与缺陷】
    - 正常：书页厚度导致的整体轻微抬高，边缘整齐
    - 缺陷：角部有实质性的向上翘起、向内折叠、或弯曲变形

    Step 4 - 封面整体平整度检查:
    封面是否整体平整：
    - [ ] 封面是否有明显的整体弯曲/弧形变形：明显露出第二页的大量内容
    - [ ] 书籍平放时，封面是否严重翘起不贴合桌面
    - [ ] 封面是否有波浪形起伏或扭曲变形

    Step 5 - 封面完整性检查:
    - 封面是否有折痕线（从一角延伸到另一角的明显折线）
    - 是否有压痕（局部凹陷，可能是重物压迫造成）
    - 是否有划痕（细长痕迹，可能刮伤封面）
    - 是否有撕裂（封面材料破损开裂）
    - 精装书的书壳是否有破损

    Step 6 - 书脊检查:
    - 书脊顶部是否平整，是否有分层或开裂
    - 书脊底部是否平整，是否有破损
    - 书脊与封面连接处是否完好
    - 精装书的书脊与书壳连接处是否牢固

    Step 7 - 表面质量检查:
    - 封面是否有污渍（颜色异常、斑点）
    - 边角是否有磨损发白（与封面正常颜色对比）
    - 是否有水渍、油渍等液体痕迹

    Step 8 - 书页结构检查（重点！）:
    【重点检查】书页装订状态：
    - [ ] 书页是否紧密装订在一起（正常状态）
    - [ ] 书页之间是否有明显缝隙或散开
    - [ ] 书页底部/侧面是否整齐对齐（不齐=变形）
    - [ ] 是否有书页翘起或脱离装订线

    Step 9 - 装帧检查（精装书/特殊装帧书）:
    - 书页是否牢固装订
    - 是否有书页脱落风险
    - 装订线/胶是否完好

    Step 10 - 对比参考图（重要！）:
    【关键步骤】与参考图对比是判断缺陷的重要依据：
    - 参考图边角形状 vs 查询图边角形状
    - 参考图塑封状态 vs 查询图塑封状态
    - 参考图表面状态 vs 查询图表面状态
    - 【重要】对比时关注实质性的形状差异（如翘起、折痕），而不是拍摄角度造成的视觉差异

    【重要】标签/贴纸差异说明：
    - 参考图有标签而查询图无标签，或参考图无标签而查询图有标签，均属于正常情况
    - 标签、贴纸、条形码的有无不属于缺陷，不纳入缺陷判定

    【正常情况 vs 缺陷】
    - 正常：书页厚度导致的整体轻微抬高（边缘整齐，无变形）
    - 缺陷：角部有实质性的向上翘起、向内折叠、或弯曲变形

    ## 判定规则

    【Penetration 塑封膜破损缺陷标准】（仅针对塑封书）:
    - 塑封膜破损/撕裂 → defect ≥ 0.8
    - 塑封开口/密封不严 → defect ≥ 0.7

    【Deformation 贴合度缺陷标准】（仅针对塑封书）:
    - 塑封严重松垮（大面积气泡）→ defect ≥ 0.8
    - 塑封轻微松垮/褶皱 → defect ≥ 0.6

    【Deformation 变形缺陷标准】（书籍本身）:
    【注意】角部翘起/折角是常见缺陷，必须仔细检查！

    【dog-ear折角评分标准】
    - 极轻微折痕（几乎不可见，需仔细观察） → defect = 0.6
    - 轻微折角（可见三角形折痕，但不严重） → defect = 0.7
    - 明显折角（清晰三角形折叠，角部翘起） → defect = 0.8
    - 严重折角（大面积折叠，多层翘起） → defect = 0.9
    - 非常严重（角部完全翻折，露出内页） → defect = 1.0

    【封面弯曲评分标准】
    - 轻微弯曲（封面与桌面间隙5-10mm） → defect = 0.6
    - 明显弯曲（封面与桌面间隙10-20mm，呈弧形） → defect = 0.8
    - 严重弯曲（封面与桌面间隙>20mm，严重变形） → defect = 0.9-1.0

    【其他变形标准】
    - 两个及以上角落翘起/折角 → defect ≥ 0.9
    - 轻微折痕线 → defect ≥ 0.6
    - 明显折痕线贯穿封面 → defect ≥ 0.8
    - 书脊轻微开裂或分层 → defect ≥ 0.6
    - 书脊明显开裂或分层 → defect ≥ 0.8
    - 精装书书壳轻微破损 → defect ≥ 0.6
    - 精装书书壳明显破损 → defect ≥ 0.8

    【正常情况 vs 缺陷】
    - 正常：书页厚度导致的整体轻微抬高（边缘整齐，无变形）
    - 缺陷：角部有实质性的向上翘起、向内折叠、或弯曲变形

    【Superficial 表面缺陷标准】:
    - 角落轻微磨损发白 → defect ≥ 0.6
    - 角落明显磨损发白 → defect ≥ 0.8
    - 轻微划痕可见 → defect ≥ 0.6
    - 明显划痕 → defect ≥ 0.8
    - 任何污渍/水渍/油渍 → defect ≥ 0.6
    - 大面积污渍 → defect ≥ 0.8
    - 页面褶皱 → defect ≥ 0.6

    【Missing/Deconstruction 装帧缺陷标准】（精装书）:
    - 装帧松动/书页脱落风险 → defect ≥ 0.8
    - 书页已脱落 → defect ≥ 1.0
    - 书本打开可以明显看见内部页面 → defect ≥ 1.0
    - 书本翻开或展开并倒扣放置 → defect ≥ 1.0
    - 螺旋装订书页不整齐：可以明显看到其他页面 → defect ≥ 0.8
    - 书页结构松散/装订不齐：书页明显参差不齐，内页相对于封面有显著伸出和散开现象 → defect ≥ 0.8
    - 腰封松动：封底条/封面腰封歪斜不齐、松动

    【包装异常】
    - 书籍的外包装材料破损 → defect ≥ 0.8
    - 外包装材料未完全包裹书本 → defect ≥ 0.8

    【摆放异常】
    - 展开平铺/摊开展示：封面和封底**同时可见**或者**都不可见**  → defect = 1.0

cardboard:
  name: "硬纸板/纸箱"
  analysis_prompt: |
    ## 领域知识                                                             
    这是【硬纸板/纸箱/硬纸盒】包装，常见缺陷模式：
                                                                            
    **【重点】以下所有情况都属于缺陷，必须检测：**
                                                                            
    1. **边缘翘起/分层（最常见漏检！）**：纸板边缘翘起、分层、不整齐
    2. **变形/凹陷**：箱体扭曲、鼓胀、塌陷、角落凹陷                        
    3. **表面破损**：撕裂、穿孔、磨损、折痕、压痕
    4. **封口/密封问题**：胶带脱落、封口敞开、盖子未盖好                    
    5. **污渍/水渍**：表面污染或水浸痕迹
    6. **角落破损**：压碎、变形、瓦楞外露                                   
                                          
    ## 缺陷检查清单（逐项确认）—— 必须全部检查！                       
                                          
    【关键】以下检查项必须逐一检查，不能跳过！
                                                                            
    Step 1 - 边缘检查（重点！常见漏检项）：
    【必须放大检查所有边缘】边缘翘起/分层是最容易被忽略的缺陷！             
    【什么是边缘翘起】纸板边缘不是平直的，而是向上/向外翘起，或出现分层剥离
    【检查位置】纸箱的四个侧边（左、右、上、下）的纸板边缘             
    - [ ] 左侧边缘：是否翘起、分层、不整齐 
    - [ ] 右侧边缘：是否翘起、分层、不整齐 
    - [ ] 上侧边缘：是否翘起、分层、不整齐                                  
    - [ ] 下侧边缘：是否翘起、分层、不整齐
                                                                            
    Step 2 - 四角结构检查:       
    观察纸箱四个角，分别确认：                                         
    - [ ] 左上角: 是否压碎/凹陷/变形       
    - [ ] 右上角: 是否压碎/凹陷/变形
    - [ ] 左下角: 是否压碎/凹陷/变形
    - [ ] 右下角: 是否压碎/凹陷/变形       
    - [ ] 角落瓦楞结构是否外露或破损                                        
                                
    Step 3 - 箱体形状检查:                                                  
    - [ ] 整体形状是否为规整的长方体
    - [ ] 是否有鼓胀（向外凸出）                                       
    - [ ] 是否有塌陷（向内凹陷）           
    - [ ] 各面是否平整      
    - [ ] 是否有明显的扭曲或变形

    Step 4 - 表面完整性检查:                                                
    - [ ] 纸板表面是否有撕裂（破损开裂）
    - [ ] 是否有穿孔（孔洞）                                                
    - [ ] 是否有明显压痕（重物压迫痕迹）
    - [ ] 是否有折痕（非正常折叠线）                                   
    - [ ] 表面是否平整，有无凹凸不平       
                                
    Step 5 - 密封状态检查（常见漏检！）：
    【关键】封口问题是常见缺陷类型！
    - [ ] 胶带是否完整粘贴  
    - [ ] 封口是否严密 
    - [ ] 是否有开箱痕迹
    - [ ] 盖子是否打开或未盖好                                              
    - [ ] 盖子舌头是否没有完全插入         
                                                                            
    Step 6 - 对比参考图:         
    如果提供参考图，对比：                                             
    - 参考图边缘状态 vs 查询图边缘状态     
    - 参考图箱体形状 vs 查询图箱体形状
    - 参考图边角状态 vs 查询图边角状态
    - 参考图封口状态 vs 查询图封口状态
    - 任何明显差异 = 变形/缺陷证据

    【重要】标签/贴纸差异说明：                                             
    -
    参考图有标签而查询图无标签，或参考图无标签而查询图有标签，均属于正常情况
    - 标签、贴纸、条形码的有无不属于缺陷，不纳入缺陷判定
                                                                      
    【重要】拍摄角度差异说明：             
    - 查询图和参考图的拍摄角度可能不同，这种视觉差异不属于缺陷
    - 只有实质性的结构差异（如边缘翘起、形状变形）才是缺陷
                        
    ## 判定规则             
                      
    【Deformation 变形缺陷标准】:
    - 边缘翘起/分层/不整齐 → defect ≥ 0.5                                   
    - 单角轻微压痕/变形 → defect ≥ 0.5
    - 单角明显压碎/凹陷 → defect ≥ 0.7                                      
    - 多角压碎或箱体明显变形 → defect ≥ 0.8
    - 箱体严重塌陷/鼓胀 → defect ≥ 0.9                                 
    - 任何可见的箱体扭曲/变形 → defect ≥ 0.6
                                
    【Penetration/Superficial 破损缺陷标准】:
    - 纸板轻微折痕/压痕 → defect ≥ 0.5
    - 表面撕裂/穿孔 → defect ≥ 0.7
    - 任何污渍/水渍 → defect ≥ 0.5         
    - 大面积污渍/水渍 → defect ≥ 0.7
    - 表面磨损露瓦楞 → defect ≥ 0.5                                         
                                    
    【Actuation 封口缺陷标准】（常见漏检！必须重视！）:                     
    - 胶带完全脱落 → defect ≥ 0.7
    - 胶带部分脱落/翘起 → defect ≥ 0.5                                 
    - 封口完全敞开 → defect ≥ 0.8          
    - 封口轻微开口/松动 → defect ≥ 0.5     
    - 盖子未盖好/打开 → defect ≥ 0.6
                                                                            
    【Sealing 密封缺陷标准】:              
    - 胶带脱落/翘起 → defect ≥ 0.5                                          
    - 封口不严/有开口 → defect ≥ 0.6
                                                                      
    【Perfect 无缺陷标准】:                
    - 边缘整齐无翘起、四角完好、箱体规整、表面洁净、胶带牢固、封口严密 →
    defect = 0.0                           
                                                                            
    ## 特别说明                  
    - 【必须全部检查】上述所有检查项必须逐一检查，不能跳过任何一项！        
    - 宁可误报一些，不可漏检：发现任何疑似缺陷都应该适当提高分数            
    - 拍摄角度造成的视觉差异不是缺陷，只有实质性的结构异常才是缺陷


plastic_hard:
  name: "硬塑料"
  analysis_prompt: |
    ## 领域知识
    这是【硬塑料】容器/包装，包括塑料瓶、硬塑盒、泵头瓶等。常见缺陷模式：

    【高优先级缺陷】
    - **拆解/分离/部件缺失（Deconstruction）**：外盖/泵头/喷嘴与瓶身分离、脱落、缺失；部件之间出现不应有的缝隙或松动；泵头/喷嘴机构解体或内部部件外露；包装外壳/底座与主体分离
    - **功能失效（Actuation）**：泵头/喷嘴/按压机构无法正常工作、损坏或脱落

    【其他缺陷】
    - 裂缝/断裂：塑料壳体开裂或断裂
    - 变形/凹陷：受挤压导致的形状改变
    - 瓶盖/封口问题：盖子翘起、密封不严
    - 表面划痕/磨损：刮擦痕迹或异常磨损
    - 污渍/残留：表面污染或标签残留

    ## 缺陷检查清单（逐项确认）—— CoT推理

    Step 1 - 拆解/分离检查（重要！）:
    仔细观察查询图，逐一检查以下项目：
    - [ ] 外盖（如果产品有外盖）是否在瓶身上？还是与瓶身分离/脱落/放在旁边？
    - [ ] 泵头/喷嘴是否牢固安装在瓶口？还是松动/脱落？
    - [ ] 泵头/喷嘴内部结构是否外露（正常应密封完整）
    - [ ] 是否有部件缺失（对比参考图，查询图少了某个部件）
    - [ ] 部件之间是否有不应有的缝隙或松动
    - [ ] 包装外壳/底座是否与主体分离

    【拆解/分离判断要点】
    - 对于带外盖的泵头瓶：外盖和泵头是两个独立部件。外盖脱落而泵头仍在 ≠ 无缺陷。外盖分离本身就是Deconstruction缺陷
    - 如果查询图显示外盖/泵头与瓶身分离，而参考图中同一部件在正常位置 → 判定为Deconstruction缺陷
    - 如果参考图中部分图片也显示开盖状态，但查询图的开盖程度更严重（如盖子完全脱离且远离瓶身 vs 盖子只是被旋开放在旁边），仍判定为缺陷
    - 如果查询图和参考图的部件状态完全一致（如都是开盖展示），且无其他损坏，则可能是正常展示状态

    Step 2 - 功能失效检查:
    - [ ] 泵头/喷嘴机构是否完好
    - [ ] 按压机构是否正常
    - [ ] 是否有部件损坏导致无法正常使用

    Step 3 - 结构完整性检查:
    - [ ] 瓶身/盒体是否有裂缝
    - [ ] 是否有断裂（部分缺失）
    - [ ] 是否有明显变形
    - [ ] 是否有凹陷

    Step 4 - 封口状态检查:
    - 盖子是否完全闭合
    - 盖子是否翘起或未旋紧
    - 封口膜是否完整
    - 是否有泄漏痕迹

    Step 5 - 表面质量检查:
    - 是否有可见的划痕、磨损、损伤痕迹
    - 是否有污渍
    - 透明度是否正常
    【注意】硬塑料表面的模具接缝、印刷图案、反光高光属于正常工艺特征，不属于缺陷
    【注意】划痕/磨损的判断：如果查询图表面有明显的白色划痕、磨损痕迹或网状裂纹，且这些痕迹比参考图更明显或更密集，应判定为表面缺陷

    Step 6 - 对比参考图:
    逐项对比参考图和查询图：
    - 参考图部件完整性 vs 查询图部件完整性
    - 参考图盖子/封口状态 vs 查询图盖子/封口状态
    - 参考图形状 vs 查询图形状
    - 参考图表面状态 vs 查询图表面状态

    【重要】标签/贴纸差异说明：
    - 标签、贴纸、条形码的有无不属于缺陷，不纳入缺陷判定

    ## 判定规则

    【Deconstruction 拆解/分离缺陷标准】:
    - 外盖/泵头/喷嘴与瓶身完全分离或脱落 → defect ≥ 0.9
    - 部件缺失 → defect ≥ 0.9
    - 外盖打开/脱离瓶身（参考图显示闭合时）→ defect ≥ 0.8
    - 泵头/喷嘴松动但未完全脱落 → defect ≥ 0.7
    - 部件之间出现不应有的缝隙 → defect ≥ 0.7
    - 泵头/喷嘴内部结构外露 → defect ≥ 0.8
    - 外盖脱离但参考图也显示开盖（无其他损坏）→ defect = 0.3-0.5

    【Actuation 功能失效标准】:
    - 泵头/喷嘴机构损坏或无法工作 → defect ≥ 0.8
    - 按压机构变形或断裂 → defect ≥ 0.8

    【Deformation 变形缺陷标准】:
    - 轻微变形/凹陷 → defect ≥ 0.6
    - 明显变形 → defect ≥ 0.8
    - 裂缝 → defect ≥ 0.8
    - 严重变形/破裂 → defect ≥ 0.9
    - 断裂或严重泄漏 → defect ≥ 1.0

    【Sealing 封口缺陷标准】:
    - 盖子翘起/未旋紧 → defect ≥ 0.7
    - 封口膜破损 → defect ≥ 0.7
    - 泄漏痕迹 → defect ≥ 0.8

    【Superficial 表面缺陷标准】:
    - 可见的划痕/磨损/损伤痕迹 → defect ≥ 0.6
    - 深度可见的明显划痕 → defect ≥ 0.8
    - 明显污渍/残留 → defect ≥ 0.6
    - 大面积污渍 → defect ≥ 0.8
    - 透明度异常 → defect ≥ 0.6

    【Perfect 无缺陷标准】:
    - 结构完整、所有部件在位、封口严密、表面洁净 → defect = 0.0


plastic_tight_wrap:
  name: "塑料紧包装/塑封"
  analysis_prompt: |
    ## 领域知识
    这是【塑料紧包装/热收缩膜/塑封】包装。常见缺陷模式：
    - **膜破损/撕裂/穿孔**：塑封膜有破洞、裂口或撕裂（最常见缺陷）
    - **密封开口/边缘裂开**：膜边缘与商品分离形成缝隙/开口
    - **内容物外露**：商品部分露出膜外（严重缺陷）
    - **膜严重松垮**：膜与商品之间有明显空隙，不贴合

    【关键区分：自然纹理 vs 实际破损】
    这是最容易混淆的地方！必须仔细观察：

    【自然纹理的特征 - 正常现象】
    - 均匀的褶皱：膜表面有规则的、分布均匀的收缩褶皱
    - 反光条纹：光线照射产生的自然反光条纹
    - 紧贴形态：膜完全紧贴商品轮廓，无翘起或分离
    - 边缘整齐：膜边缘与商品边缘平行，无翘起

    【实际破损的特征 - 缺陷】
    - 材料断开：膜有明显的裂口，两侧材料分离
    - 边缘翘起：膜边缘翘起并与商品表面分离，形成可见空隙
    - 内容物外露：通过破损处可以看到内部商品或商品露出
    - 孔洞/穿孔：膜上有明显的破洞，可能透光

    ## 缺陷检查清单（逐项确认）—— CoT推理

    Step 1 - 开口检查（最重要！最易漏检）：
    【关键】开口是膜边缘与商品分离形成的空隙，不是褶皱！
    【检查方法】观察膜是否完全紧贴商品，有无分离翘起

    【必须逐一检查四个角落】
    - [ ] 左上角：膜是否完全紧贴，有无开口/缝隙（常见漏检！）
    - [ ] 右上角：膜是否完全紧贴，有无开口/缝隙（常见漏检！）
    - [ ] 左下角：膜是否完全紧贴，有无开口/缝隙（常见漏检！）
    - [ ] 右下角：膜是否完全紧贴，有无开口/缝隙（常见漏检！）

    【检查四条边缘】
    - [ ] 上边缘：膜是否密封，有无开口/翘起/分离
    - [ ] 下边缘：膜是否密封，有无开口/翘起/分离
    - [ ] 左边缘：膜是否密封，有无开口/翘起/分离
    - [ ] 右边缘：膜是否密封，有无开口/翘起/分离

    【开口判定标准】
    - 膜边缘明显翘起并与商品表面分离 → 开口
    - 可以看到膜下的商品通过缝隙露出 → 开口
    - 膜与商品之间有明显空隙（不是紧贴的起伏） → 开口

    Step 2 - 破损/撕裂检查（重点！）：
    【必须放大检查】膜破损是最严重的缺陷！
    - [ ] 膜是否有撕裂（裂口、裂缝）
    - [ ] 膜是否有穿孔（破洞、孔洞）
    - [ ] 破损处内容物是否外露或可能外露

    【破损 vs 褶皱的关键区别】
    - 破损：膜材料不连续，有实际的裂口或孔洞
    - 褶皱：膜材料连续完整，只是表面起伏

    Step 3 - 内容物外露检查（最严重缺陷）：
    【必须仔细观察】
    - [ ] 商品是否有任何部分露出膜外（哪怕只是一小部分）
    - [ ] 膜破损处是否导致内容物可能掉出
    - [ ] 检查四个角落是否有内容物露出

    Step 4 - 膜贴合度检查:
    - [ ] 膜是否严重松垮（大面积不贴合，有明显空隙）
    - [ ] 膜与商品之间是否有大面积气泡（不是自然褶皱）
    【正常】膜紧贴商品的自然形态、有均匀收缩纹理

    Step 5 - 对比参考图（关键步骤！）：
    【关键步骤】将查询图与参考图对比：
    - 参考图膜是否完好 vs 查询图膜是否破损
    - 参考图边缘是否密封 vs 查询图边缘是否开口
    - 参考图表面纹理 vs 查询图表面纹理

    【判定规则】
    - 参考图膜完好 + 查询图有破损/开口 → 缺陷（defect ≥ 0.8）
    - 参考图和查询图状态相似 → 正常（defect = 0.0）

    【重要】标签/贴纸差异说明：
    - 参考图有标签而查询图无标签，或反之，均属于正常情况
    - 标签、贴纸、条形码的有无不属于缺陷

    ## 判定规则

    【Penetration/Deconstruction 膜破损标准】：
    - 膜破损/撕裂/穿孔（任何大小） → defect ≥ 0.8
    - 膜破损导致内容物外露 → defect ≥ 0.9
    - 膜大面积破损/裂开 → defect ≥ 0.9

    【Sealing 密封缺陷标准】：
    - 膜边缘开口/密封不严（边缘翘起与商品分离） → defect ≥ 0.8
    - 封口处开裂 → defect ≥ 0.7

    【Deformation 贴合度缺陷标准】：
    - 膜严重松垮/大面积不贴合 → defect ≥ 0.7
    - 内容物因塑封明显变形 → defect ≥ 0.7

    【Perfect 无缺陷标准】：
    - 膜完好无破损、边缘密封严密无开口、膜紧贴商品 → defect = 0.0

    ## 特别说明
    - 塑封膜的自然热收缩纹理、均匀的褶皱、反光属于正常现象，不视为缺陷
    - 只有当膜有**实际的物理破损**（破洞、撕裂、开口、边缘翘起分离）时才判定为缺陷 ≥ 0.8
    - 【关键】开口是边缘翘起分离形成的空隙，不是自然褶皱！
    - 对比参考图是判断的关键依据


plastic_loose_bag:
  name: "塑料松散袋"
  analysis_prompt: |
    ## 领域知识                                                             
    这是【塑料松散袋/PE袋/普通塑料袋】包装，常见缺陷模式：                  
                                                                        
    **【重点】以下所有情况都属于缺陷，必须检测：**                          
                                                                          
    1. **封口敞开/未闭合（最常见漏检！）**：封口没有合上，可以看到内部商品，
    这是最常见的缺陷！                                                      
    2. **内容物外露（最严重）**：商品部分或全部露出袋外，完全失去包装保护   
    3. **袋子破损**：穿孔、撕裂、破洞（即使内容物未外露也是缺陷！）         
    4. **袋子松垮/包裹不紧**：袋子过于宽松，内容物可能掉落                  
    5. **袋子变形**：袋子扭曲、变形、压扁                                   
    6. **内容物泄漏**：液体/粉末从袋内渗出                               t  
    7. **污渍**：袋子表面污染                                               
                                                                            
    【重要】塑料袋是透明的，内部商品清晰可见是正常现象！只有商品**物理上**露
    出袋外才算外露。                                                        
                                                                            
    ## 缺陷检查清单（逐项逐项确认）—— 必须全部检查！                        
                                                                            
    【关键】封口检查是重点！很多缺陷是因为封口没有合好！                    
                                                                            
    Step 1 - 封口状态检查（最重要！必须仔细检查！）:                        
    【漏检重灾区】封口敞开是最容易被漏检的缺陷！
    - [ ] **封口是否完全闭合** → 仔细看封口处是否有缝隙/开口                
    - [ ] 封口边缘是否整齐贴合 → 如果看到内部商品露出，说明封口未闭合！
    - [ ] 封口处是否有明显开口（可以看到内部商品）                       
    - [ ] 封口是否有松动或未对齐           
    - 【判定技巧】如果从图片中能看到袋子里面的商品轮廓，且不是因为透明袋的原
    因，那就是封口敞开！ 
                        
    Step 2 - 袋子完整性检查:               
    - [ ] 袋子是否有破损/穿孔（孔洞）
    - [ ] 袋子是否有撕裂（裂口）                                            
    - [ ] 袋子是否完全包裹商品（无破洞）
                                                                            
    Step 3 - 袋子松紧度/形状检查:
    - [ ] 袋子是否过于宽松/松垮                                          
    - [ ] 内容物是否因袋子过大而可能掉落   
    - [ ] 袋子是否未能紧贴商品（有空隙）
    - [ ] 袋子是否有明显变形/扭曲                                           
    
    Step 4 - 内容物状态检查:                                                
    - [ ] 是否有内容物泄漏/渗出（液体、粉末）
    - [ ] 是否有内容物外露（商品超出袋子边界）                           
                                          
    Step 5 - 区分"内容物可见"vs"封口敞开"vs"内容物外露":
    - "内容物可见"：商品被透明塑料袋包裹，轮廓清晰可见 → 正常
    - "封口敞开"：封口没有合上，可以看到内部商品露出袋口 → 缺陷！
    - "内容物外露"：商品的一部分超出袋子边界，物理上在袋外 → 缺陷
    - 【判定】如果能看到商品是因为封口没合好（商品从袋口露出），那就是封口敞
    开缺陷！                  
                                
    Step 6 - 对比参考图:                                                    
    如果提供参考图，对比：       
    - 参考图封口状态 vs 查询图封口状态 ← 重点对比封口！                     
    - 参考图包装方式 vs 查询图包装方式
    - 参考图袋子松紧度 vs 查询图袋子松紧度                               
                                          
    【重要】标签/贴纸差异说明：                                             
    -
    参考图有标签而查询图无标签，或参考图无标签而查询图有标签，均属于正常情况
    - 标签、贴纸、条形码的有无不属于缺陷，不纳入缺陷判定
                                                                        
    ## 判定规则                            
                                
    【Actuation 封口缺陷标准】（最常见漏检！必须重视！）:
    - 封口完全敞开（能看到内部商品露出袋口）→ defect ≥ 0.9
    - 封口未完全闭合（有明显缝隙）→ defect ≥ 0.7
    - 封口轻微松动/未对齐 → defect ≥ 0.5
                                                                            
    【Penetration/Deconstruction 破损缺陷标准】:
    - 袋子破损/撕裂/穿孔（任何孔洞）→ defect ≥ 0.7                          
    - 封口完全未闭合/大开 → defect ≥ 0.8
    - 封口轻微开口/松动 → defect ≥ 0.5                                   
                                          
    【Deformation 变形/松垮缺陷标准】:
    - 袋子严重松垮，内容物可能掉落 → defect ≥ 0.7
    - 袋子轻微松垮/包裹不紧 → defect ≥ 0.5
    - 袋子明显变形/扭曲 → defect ≥ 0.6                                      
                              
    【Spillage 泄漏缺陷标准】:                                              
    - 内容物泄漏/渗出 → defect ≥ 0.7 
                                                                        
    【Content Exposure 内容物外露缺陷标准】:
    - 商品任何部分物理上超出袋子边界 → defect ≥ 0.9
    - 【误报警告】透明袋内商品可见 ≠ 外露！不要误判！
    - 袋子包裹良好，商品完全在袋内 → defect = 0.0
                                                                            
    【Superficial 外观缺陷标准】:          
    - 任何可见污渍 → defect ≥ 0.5                                           
    - 明显污渍 → defect ≥ 0.7    
                                                                        
    【Perfect 无缺陷标准】:                
    - 袋子完好、封口严密闭合、**商品完全在袋内** → defect = 0.0
                        
    ## 特别说明             
    - 塑料袋的自然褶皱、柔软形态属于正常现象，不视为缺陷
    - 塑料袋透明，内部商品清晰可见是正常的，不是缺陷！                      
    - 【关键】封口敞开是最常见的缺陷类型！必须仔细检查封口是否完全闭合！
    - 【必须全部检查】上述所有检查项必须逐一检查，不能跳过任何一项！        
    - 宁可误报一些，不可漏检：发现任何疑似缺陷都应该适当提高分数


plastic_bubble_wrap:
  name: "塑料气泡膜"
  analysis_prompt: |
    ## 领域知识
    这是【塑料气泡膜/气泡袋】包装，常见缺陷模式：

    【产品缺陷（透过气泡膜观察）- 最重要！最易漏检！】
    - **拆解/分离（Deconstruction）**：产品内部部件分离、脱落、缺失。例如工具的零件散开、链条脱离、组件解体等
    - **功能失效（Actuation）**：产品无法正常工作，如机械结构损坏、活动部件失效等
    - 产品变形/损坏：产品本身因外力导致变形、断裂等

    【包装缺陷】
    - 气泡膜破损：撕裂、破洞导致气泡暴露
    - 包裹不严密：气泡膜未完全包裹商品，商品部分外露
    - 封口问题：胶带脱落或封口不严

    【⚠️ 核心原则】气泡膜包装的商品不仅要检查包装本身，还必须透过气泡膜检查内部产品的完整性！即使气泡膜完好，如果内部产品有部件分离或损坏，仍然是缺陷！

    ## 缺陷检查清单（逐项确认）—— CoT推理

    Step 1 - 内部产品完整性检查（最重要！最易漏检！）:
    【必须透过气泡膜仔细观察内部产品状态】
    - [ ] 产品各部件是否完整、连接正常
    - [ ] 产品是否有部件分离、脱落、散开
    - [ ] 产品结构是否正常，有无变形、断裂
    - [ ] 产品活动部件是否在正常位置
    - [ ] 产品的整体形状和轮廓是否与参考图一致（如果有明显差异，可能是内部部件移位或分离）
    - [ ] 产品是否有部分组件出现在异常位置（如配件散落在旁边而不是安装在主体上）
    【关键判断】
    - 对比参考图：如果查询图中产品部件散开/分离/脱落，而参考图中产品部件完整连接 → 这是Deconstruction缺陷！
    - 对比参考图：如果查询图中产品轮廓形状与参考图明显不同（如产品看起来散开了、变长了、有额外组件散落），可能是内部部件分离
    - 即使气泡膜完好，内部产品部件分离/损坏仍然是缺陷
    - 【特别注意】有些产品（如工具、链条等）在正常状态下是紧凑的一体，如果查询图中产品看起来散开或有零件分离，即使被气泡膜包裹，也应该判定为Deconstruction缺陷

    Step 2 - 气泡膜完整性检查:
    - [ ] 气泡膜是否有破损/撕裂（破洞、裂口）
    - [ ] 膜是否完全包裹商品
    - [ ] 是否有大面积气泡破裂导致保护功能下降

    Step 3 - 包裹严密性检查:
    - 气泡膜是否完全覆盖商品所有面
    - 是否有商品部分外露（透过气泡膜可以看到但未被膜覆盖的部分）
    - 【重要】对比参考图判断包裹松紧：如果参考图包裹紧密而查询图明显松散/松垮，属于包裹不严密缺陷
    - 气泡膜的褶皱和松散是两回事：褶皱是膜表面的起伏，松散是膜与商品之间有大面积空隙或商品部分暴露

    Step 4 - 封口检查:
    - 胶带是否牢固粘贴
    - 封口是否严密
    - 是否有散开风险

    Step 5 - 对比参考图（关键步骤！）:
    【必须逐项对比参考图和查询图】
    - 参考图内部产品状态 vs 查询图内部产品状态（部件是否完整？是否散开？）← 最重要！
    - 参考图包裹方式 vs 查询图包裹方式
    - 参考图膜完整性 vs 查询图膜完整性
    - 参考图产品结构 vs 查询图产品结构

    【重要】标签/贴纸差异说明：
    - 标签、贴纸、条形码的有无不属于缺陷，不纳入缺陷判定

    ## 判定规则

    【Deconstruction 拆解/分离缺陷标准】（产品内部部件分离）:
    - 产品部件散开/分离/脱落（对比参考图，参考图中完整而查询图中散开）→ defect ≥ 0.9
    - 产品部件部分松动/错位 → defect ≥ 0.7

    【Actuation 功能失效标准】:
    - 产品功能部件损坏/无法正常工作 → defect ≥ 0.8

    【Penetration 破损缺陷标准】（气泡膜本身）:
    - 气泡膜破损/撕裂/破洞 → defect ≥ 0.8
    - 包裹不严密（商品外露）→ defect ≥ 0.8
    - 气泡膜明显松散未包裹商品（对比参考图）→ defect ≥ 0.6

    【Sealing 封口缺陷标准】:
    - 胶带脱落/翘起 → defect ≥ 0.6
    - 封口不严/有散开风险 → defect ≥ 0.7

    【Deformation 变形缺陷标准】:
    - 产品因外力变形/断裂 → defect ≥ 0.8

    【Perfect 无缺陷标准】:
    - 气泡膜完整包裹、封口牢固、内部产品完整无损 → defect = 0.0

    ## 特别说明
    - 气泡膜表面的自然褶皱属于正常现象，不视为缺陷
    - 但气泡膜与商品之间的大面积空隙、商品暴露在膜外、或膜明显松散未包裹商品，不属于"自然褶皱"，属于包裹不严密缺陷
    - 个别气泡压扁不属于缺陷，但大面积气泡破裂导致保护功能下降是缺陷
    - 内部产品的部件分离/损坏，即使气泡膜完好，也必须判定为缺陷


paper:
  name: "纸张"
  analysis_prompt: |
    ## 领域知识
    这是【纸张/纸质材料】，常见缺陷模式：
    - 褶皱/折痕：纸张有明显折叠痕迹
    - 破损/撕裂：纸张边缘或中间有撕裂
    - 污渍：油渍、水渍、墨渍等
    - 变形：受潮变形、卷曲
    - 穿孔：纸张上有孔洞

    ## 缺陷检查清单（逐项确认）—— CoT推理

    Step 1 - 平整度检查:
    - [ ] 纸张是否有明显褶皱
    - [ ] 是否有折痕（直线痕迹）
    - [ ] 是否卷曲变形

    Step 2 - 完整性检查:
    - 纸张边缘是否完好
    - 是否有撕裂/破损
    - 是否有穿孔（孔洞）

    Step 3 - 表面质量检查:
    - 是否有污渍（颜色异常）
    - 是否有水渍痕迹
    - 是否有墨迹或其他污染

    Step 4 - 对比参考图:
    如果提供参考图，对比平整度和完整性和包装方式

    【重要】标签/贴纸差异说明：
    - 参考图有标签而查询图无标签，或参考图无标签而查询图有标签，均属于正常情况
    - 标签、贴纸、条形码的有无不属于缺陷，不纳入缺陷判定

    ## 判定规则

    【Deformation 变形缺陷标准】:
    - 轻微褶皱/卷曲 → defect ≥ 0.6
    - 明显褶皱/折痕 → defect ≥ 0.8
    - 受潮变形/严重卷曲 → defect ≥ 0.8

    【Penetration 破损缺陷标准】:
    - 边缘轻微破损 → defect ≥ 0.6
    - 撕裂/穿孔 → defect ≥ 0.8
    - 相比参考图，包装纸包裹不严实或者有撕开的状态  → defect ≥ 0.8

    【Superficial 表面缺陷标准】:
    - 任何污渍/水渍/墨渍 → defect ≥ 0.6
    - 明显污渍 → defect ≥ 0.8

    【Perfect 无缺陷标准】:
    - 完好平整、无褶皱、无污渍 → defect = 0.0


other:
  name: "其他材质"
  analysis_prompt: |
    ## 领域知识
    这是【其他材质/混合材质】商品，无法归入上述特定类别。需要综合判断以下常见缺陷：
    - 变形：压碎、弯曲、凹陷、翘曲
    - 破损：撕裂、穿孔、开裂、断裂
    - 泄漏：内容物溢出、液体/粉末渗出
    - 表面缺陷：划痕、污渍、褪色、磨损
    - 结构问题：部件缺失、装配不当、密封不严

    ## 缺陷检查清单（逐项确认）—— CoT推理

    Step 1 - 整体外观检查:
    - [ ] 商品整体形状是否正常
    - [ ] 是否有明显变形或扭曲
    - [ ] 包装是否完整包裹商品

    Step 2 - 结构完整性检查:
    - 是否有破损/撕裂/开裂
    - 是否有穿孔（孔洞）
    - 是否有断裂或部件缺失
    - 密封是否严密

    Step 3 - 表面质量检查:
    - 是否有划痕（细长痕迹）
    - 是否有污渍（颜色异常）
    - 是否有磨损（表面损耗）
    - 是否有褪色（颜色变化）

    Step 4 - 泄漏检查:
    - 是否有内容物溢出
    - 是否有液体/粉末泄漏痕迹
    - 包装是否有浸湿痕迹

    Step 5 - 对比参考图:
    将查询图与参考图对比，识别所有视觉差异：
    - 形状差异
    - 表面差异
    - 结构差异
    - 任何偏离参考图的状态都可能是缺陷

    【重要】标签/贴纸差异说明：
    - 参考图有标签而查询图无标签，或参考图无标签而查询图有标签，均属于正常情况
    - 标签、贴纸、条形码的有无不属于缺陷，不纳入缺陷判定

    ## 判定规则

    【Deformation 变形缺陷标准】:
    - 轻微变形/弯曲/凹陷/翘曲 → defect ≥ 0.6
    - 明显变形（可能影响使用）→ defect ≥ 0.8
    - 严重变形（严重影响使用）→ defect ≥ 1.0

    【Penetration/Deconstruction 破损缺陷标准】:
    - 轻微破损/小撕裂 → defect ≥ 0.6
    - 明显破损（穿孔、开裂）→ defect ≥ 0.8
    - 严重破损（断裂、大撕裂）→ defect ≥ 1.0

    【Spillage 泄漏缺陷标准】:
    - 轻微泄漏痕迹 → defect ≥ 0.7
    - 明显泄漏（内容物渗出）→ defect ≥ 0.9

    【Superficial 表面缺陷标准】:
    - 任何划痕/污渍/褪色/磨损 → defect ≥ 0.6
    - 明显划痕/污渍 → defect ≥ 0.8
    - 大面积污渍/严重划痕 → defect ≥ 0.9

    【Sealing 密封缺陷标准】:
    - 密封不严/装配不当 → defect ≥ 0.6

    【Missing 缺失缺陷标准】:
    - 部件缺失（标签/贴纸除外）→ defect ≥ 0.8
    - 多件缺失 → defect ≥ 1.0

    【Perfect 无缺陷标准】:
    - 形状正常、结构完好、表面洁净、密封严密 → defect = 0.0

    【包装异常】
    - 包装材料未完全包裹商品 → defect ≥ 0.8
    - 蜂窝状纸网未完全包裹商品 → defect ≥ 0.8

    ## 特别说明
    由于材质归类为"other"，请特别仔细地对比参考图，任何与参考图不一致的地方都可能是缺陷。
    但标签、贴纸的有无不属于缺陷，不应因此判定为Missing。
    不确定时倾向于判为有缺陷（漏检比误报更严重）。
